<!--
  A real vat session, captured by running the commands and rendered to frames.
  Revealed with CSS keyframes rather than script, because GitHub serves README
  images through a proxy that strips scripts but keeps animation.
  Regenerate after changing any of this output; it is documentation, and stale
  documentation is the thing this tool exists to catch.
-->
