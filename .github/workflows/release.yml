name: Release

on:
  push:
    tags: ["v*"]

# `id-token` and `attestations` are what let this workflow sign a statement
# about what it built. Without them a release is still checksummed, and a
# checksum file published beside the artefacts it describes proves only that
# the two were published together.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest

    # The target list is declared once. Three steps walk it — build, describe,
    # package — and a platform added to only two of them would ship a binary
    # with no SBOM, or an SBOM with no binary.
    env:
      TARGETS: darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Build every platform
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODULE=github.com/takealook97/vat
          LDFLAGS="-s -w \
            -X ${MODULE}/internal/version.Version=${VERSION} \
            -X ${MODULE}/internal/version.Commit=${COMMIT} \
            -X ${MODULE}/internal/version.Date=${BUILD_DATE}"
          for target in $TARGETS; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/vat_${os}_${arch}${ext}" ./cmd/vat
          done

      # One SBOM per target, because the generator stamps goos and goarch into
      # every purl it writes: a single SBOM shipped against all five archives
      # would name a platform four of them are not.
      #
      # The generator is installed, not added to go.mod. It is a build tool, and
      # the dependency count in go.mod is a property this project publishes — an
      # SBOM that inflated that count in order to be produced would be evidence
      # against the thing it exists to attest. It is built natively and told the
      # target only at run time; `go run` with GOOS set cross-compiles the
      # generator itself and then cannot execute it.
      - name: Describe every target in an SBOM
        env:
          SBOM_TOOL: github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
        run: |
          go install "$SBOM_TOOL"
          generator="$(go env GOPATH)/bin/cyclonedx-gomod"
          for target in $TARGETS; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" "$generator" app \
              -main ./cmd/vat -licenses -json \
              -output "dist/vat_${os}_${arch}.cdx.json" .
          done

      # Completions are generated once with a natively runnable build. The
      # cross-compiled binaries cannot execute on the runner, so asking each one
      # for its own completion script would silently produce empty files.
      - name: Generate shell completions
        run: |
          mkdir -p completions
          go run ./cmd/vat completion bash > completions/vat.bash
          go run ./cmd/vat completion zsh  > completions/_vat
          go run ./cmd/vat completion fish > completions/vat.fish

      # Each archive unpacks to a directory holding a binary called `vat`, not
      # `vat_linux_amd64`. Someone who downloads an archive should be able to
      # run what comes out of it without renaming it first.
      - name: Package and checksum
        working-directory: dist
        run: |
          for target in $TARGETS; do
            os="${target%/*}"; arch="${target#*/}"
            name="vat_${os}_${arch}"
            binary="vat"; ext=""
            if [ "$os" = windows ]; then binary="vat.exe"; ext=".exe"; fi
            # Staged under a separate root: for the non-Windows targets $name
            # is also the binary's own filename, so building the layout in
            # place would try to create a directory over the file.
            mkdir -p "stage/$name"
            mv "${name}${ext}" "stage/$name/$binary"
            cp ../LICENSE ../README.md "stage/$name/"
            cp -r ../completions "stage/$name/completions"
            case "$os" in
              windows) (cd stage && zip -qr "../${name}.zip" "$name") ;;
              *) tar -czf "${name}.tar.gz" -C stage "$name" ;;
            esac
            rm -rf stage
          done
          sha256sum *.tar.gz *.zip *.cdx.json > checksums.txt
          cat checksums.txt

      # Nothing here ran what it built. Five archives were packaged, checksummed,
      # attested, and published without one of them being executed once, so a
      # broken cross-compile or a renamed file inside the archive would publish
      # green and be found by a user. The Homebrew formula installs by the paths
      # below, so a rename there breaks `brew install` while the release still
      # reports success.
      #
      # linux/amd64 is native to this runner, so it costs a few seconds. The
      # other four cannot run here; this is one smoke test rather than none.
      - name: Run what was built
        working-directory: dist
        run: |
          set -eu
          rm -rf smoke && mkdir smoke
          tar -xzf vat_linux_amd64.tar.gz -C smoke
          root="smoke/vat_linux_amd64"

          # The layout the Homebrew formula's install block depends on.
          for path in vat LICENSE README.md \
                      completions/vat.bash completions/_vat completions/vat.fish; do
            test -f "$root/$path" || { echo "archive is missing $path"; exit 1; }
          done

          # It runs, and it is the version this tag published.
          reported=$("$root/vat" version)
          echo "$reported"
          case "$reported" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "binary reports \"$reported\", not ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

          # And it does the one thing that writes, in a throwaway directory.
          # An absolute path, so the check does not depend on where a shell
          # happens to have left OLDPWD.
          binary="$(pwd)/$root/vat"
          work=$(mktemp -d)
          (cd "$work" && git init --quiet . && "$binary" init --name smoke)
          test -f "$work/vat.yaml" || { echo "vat init wrote no manifest"; exit 1; }
          rm -rf smoke

      # Signed before publication, so nothing reaches the release page without a
      # statement of where it came from. The checksum file is a subject too: it
      # is the one artefact whose job is to describe the others, which makes an
      # unattested one worth forging.
      - name: Attest what built these artefacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
            dist/checksums.txt

      # Held at v2 deliberately. v3 exists, but this is the step that creates
      # the release itself and nothing short of an actual tag proves a change to
      # it — and a published tag can never be moved. It is bumped as part of a
      # release, with the run watched, not ahead of one.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
