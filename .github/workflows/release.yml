name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build every platform
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODULE=github.com/takealook97/vat
          LDFLAGS="-s -w \
            -X ${MODULE}/internal/version.Version=${VERSION} \
            -X ${MODULE}/internal/version.Commit=${COMMIT} \
            -X ${MODULE}/internal/version.Date=${BUILD_DATE}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/vat_${os}_${arch}${ext}" ./cmd/vat
          done

      # Completions are generated once with a natively runnable build. The
      # cross-compiled binaries cannot execute on the runner, so asking each one
      # for its own completion script would silently produce empty files.
      - name: Generate shell completions
        run: |
          mkdir -p completions
          go run ./cmd/vat completion bash > completions/vat.bash
          go run ./cmd/vat completion zsh  > completions/_vat
          go run ./cmd/vat completion fish > completions/vat.fish

      # Each archive unpacks to a directory holding a binary called `vat`, not
      # `vat_linux_amd64`. Someone who downloads an archive should be able to
      # run what comes out of it without renaming it first.
      - name: Package and checksum
        working-directory: dist
        run: |
          for file in vat_*; do
            [ -f "$file" ] || continue
            name="${file%.exe}"
            binary="vat"
            [ "$file" != "$name" ] && binary="vat.exe"
            # Staged under a separate root: for the non-Windows targets $name
            # is also the binary's own filename, so building the layout in
            # place would try to create a directory over the file.
            mkdir -p "stage/$name"
            mv "$file" "stage/$name/$binary"
            cp ../LICENSE ../README.md "stage/$name/"
            cp -r ../completions "stage/$name/completions"
            case "$binary" in
              vat.exe) (cd stage && zip -qr "../${name}.zip" "$name") ;;
              *) tar -czf "${name}.tar.gz" -C stage "$name" ;;
            esac
            rm -rf stage
          done
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
