name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseding a run is right on a branch, where only the latest commit is under
# review, and wrong on main, where every commit is a thing somebody may install.
# Cancelling there let three commits through unverified on 2026-08-28 — one of
# them the change a release was tagged on minutes later — and painted the badge
# red each time, because GitHub reports a cancelled run as a failed one. A badge
# that goes red for pushing twice quickly is a badge people stop reading.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # The sync state machine drives real repositories, so git must have an
      # identity before any test can commit.
      - name: Configure git
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      # Full history: the authorship check below reads the commits a push
      # brought, and a shallow clone leaves it looking at the tip alone — a
      # check that passes because it cannot see, which is worse than none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # A commit whose author cannot be reached is one nobody can ask about, and
      # GitHub links it to no profile at all. Two reached main on 2026-08-27 as
      # `t <t@e>`: a shell that had exported GIT_COMMITTER_EMAIL to build a
      # throwaway git fixture went on to commit here, and the environment beats
      # `git config`. Nothing caught it until a person read the contributor list,
      # and the repair was a history rewrite and a force push.
      #
      # The only test is that the address could route: a domain with a dot in
      # it. That holds for every real contributor and fails for every local
      # placeholder, so it needs no allow-list of who may commit.
      - name: Verify commit authorship is reachable
        run: |
          range="-20"
          if git rev-parse --quiet --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          # No pipeline into a loop: a `while read` in a subshell cannot fail
          # the step, which is how a check like this passes while finding things.
          unroutable=$(git log --format='%H %ae%n%H %ce' $range |
            awk '{ split($2, parts, "@"); if (index(parts[2], ".") == 0) print }' | sort -u)
          if [ -n "$unroutable" ]; then
            echo "these commits carry an address that cannot route:"
            echo "$unroutable"
            echo
            echo "Commit as the identity in git config user.email. Never export"
            echo "GIT_AUTHOR_EMAIL or GIT_COMMITTER_EMAIL in a shell that also commits here."
            exit 1
          fi

      # `go 1.25` in go.mod stops the compiler accepting newer *language*
      # features. It does not stop a call to a stdlib function added after
      # 1.25, so CI on `stable` compiled code that anyone building at the
      # declared minimum could not — verified with `strings.CutLast`, which
      # builds on 1.27 and does not exist in 1.25.
      #
      # The version is read from go.mod rather than written here twice, so
      # raising the directive raises this with it.
      - name: Build at the minimum toolchain go.mod declares
        run: |
          set -eu
          declared=$(go mod edit -json | sed -n 's/.*"Go": "\([^"]*\)".*/\1/p')
          case "$declared" in *.*.*) toolchain="go$declared" ;; *) toolchain="go$declared.0" ;; esac
          echo "go.mod declares $declared; building with $toolchain"
          GOTOOLCHAIN="$toolchain" go build ./...

      # vat ships as prebuilt binaries, so a standard-library advisory is frozen
      # inside every published archive: a user cannot upgrade their way out of
      # it, they need a new release. govulncheck is call-graph aware, so it
      # reports what is actually reachable rather than everything in the tree.
      # Pinned to @latest on purpose — a vulnerability scanner wants the current
      # tool and the current database, and it is a check, not a dependency.
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # v7 was the first release to run golangci-lint v2, which this
      # repository's .golangci.yml targets. v9 still does, and v7 pins a Node 20
      # runtime the runners have already begun forcing onto Node 24.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Configure git
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      # make cover, not a bare go test: the thresholds live in one place so a
      # local run and CI cannot disagree about whether a change passes. It
      # gates the total and each package separately — a total is an average,
      # and an average over unequal packages hides the ones that matter.
      - name: Measure coverage
        run: make cover

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
